steps:
  # ==========================================
  # SERVICE 1: ORCHESTRATOR (Python)
  # ==========================================
  # 1. Build the Python Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-orchestrator'
    waitFor: ['-'] # Starts immediately
    args: 
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/agent-repo/orchestrator:$BUILD_ID'
      - './services/orchestrator'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-orchestrator'
    waitFor: ['build-orchestrator']
    args: 
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/agent-repo/orchestrator:$BUILD_ID'

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-orchestrator'
    waitFor: ['push-orchestrator']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'orchestrator-service' 
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/agent-repo/orchestrator:$BUILD_ID'
      - '--region'
      - 'europe-west1'
      - '--port'
      - '8080'
      - '--timeout'
      - '300s'
      - '--min-instances'
      - '0'
      - '--set-secrets'
      - 'GITHUB_TOKEN=github-token:latest,GITLAB_TOKEN=gitlab-token:latest'
      - '--set-env-vars'
      - 'DART_NODE_URL=https://dart-node-service-eb3iwos6ma-ew.a.run.app,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=europe-west1,GOOGLE_GENAI_USE_VERTEXAI=True'

  # ==========================================
  # SERVICE 2: DART NODE
  # ==========================================
  # 4. Build the Dart Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-dart-node'
    waitFor: ['-'] # Starts immediately, parallel to Orchestrator
    args: 
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/agent-repo/dart-node:$BUILD_ID'
      - './services/dart_node'

  # 5. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-dart-node'
    waitFor: ['build-dart-node']
    args: 
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/agent-repo/dart-node:$BUILD_ID'

  # 6. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-dart-node'
    waitFor: ['push-dart-node']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dart-node-service' 
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/agent-repo/dart-node:$BUILD_ID'
      - '--region'
      - 'europe-west1'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'

  # ==========================================
  # SERVICE 3: FRONTEND (Flutter Web)
  # ==========================================
  # 7. Build Flutter Web
  - name: 'ghcr.io/cirruslabs/flutter:stable'
    id: 'build-flutter-web'
    waitFor: ['-'] # Starts immediately, parallel to backend services
    dir: 'frontend/governance_dashboard'
    entrypoint: 'flutter'
    args: 
      - 'build'
      - 'web'
      - '--wasm'
      - '--dart-define=ORCHESTRATOR_URL=https://orchestrator-service-eb3iwos6ma-ew.a.run.app'

  # 8. Build the Frontend Docker image (Nginx wrapper)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend-docker'
    waitFor: ['build-flutter-web']
    dir: 'frontend/governance_dashboard'
    args: 
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/agent-repo/governance-dashboard:$BUILD_ID'
      - '.'

  # 9. Push Frontend image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    waitFor: ['build-frontend-docker']
    args: 
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/agent-repo/governance-dashboard:$BUILD_ID'

  # 10. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'governance-dashboard-demo'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/agent-repo/governance-dashboard:$BUILD_ID'
      - '--region'
      - 'europe-west1'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--min-instances'
      - '0'

  # ==========================================
  # FINAL STEP: Print Deployment URLs
  # ==========================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'print-urls'
    waitFor: ['deploy-orchestrator', 'deploy-dart-node', 'deploy-frontend'] 
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "======================================================"
        echo "🚀 DEPLOYMENT SUCCESSFUL! HERE ARE YOUR LIVE LINKS:"
        echo "======================================================"
        echo "Backend (Orchestrator): $(gcloud run services describe orchestrator-service --region europe-west1 --format='value(status.url)')"
        echo "Dart Node (Worker): $(gcloud run services describe dart-node-service --region europe-west1 --format='value(status.url)')"
        echo "Frontend (Dashboard): $(gcloud run services describe governance-dashboard-demo --region europe-west1 --format='value(status.url)')"
        echo "======================================================"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8' # Recommended for parallel builds