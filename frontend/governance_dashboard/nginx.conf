server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Mandatory headers for Wasm / Skwasm multithreading (COOP/COEP)
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # Correct MIME types for JavaScript modules and WebAssembly
    types {
        application/javascript mjs js;
        application/wasm wasm;
        text/html html htm;
        text/css css;
        image/svg+xml svg svgz;
        application/json json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the app shell / service-worker bootstrap. Always revalidate
    # so browsers pick up new Flutter builds immediately (prevents Chrome from
    # serving a stale main.dart.wasm bundle after a deploy). Note: add_header
    # is NOT inherited once a location defines its own, so COOP/COEP are
    # repeated in each block below.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}