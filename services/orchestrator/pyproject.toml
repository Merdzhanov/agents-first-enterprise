[project]
name = "agents-first-orchestrator"
version = "2.3.0"
description = "Multi-Agent Fleet Orchestration with Google ADK 2.0, Vertex AI, and Dart Nodes"
authors = [{ name = "Agent-First Enterprise Team" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "google-auth>=2.28.0",
    "google-genai>=1.0.0",
    "google-cloud-aiplatform>=1.45.0",
    "google-cloud-pubsub>=2.20.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "sqlalchemy[asyncio]>=2.0.28",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "google-adk[db]==2.6.2"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
